# Release pipeline (ADR-0026): pushing a vX.Y.Z tag IS the user's release
# confirmation point — everything below runs automatically from there:
#   full gate → tag consistency (scripts/check-release.mjs) → dual-name
#   tarballs (scripts/pack.mjs) → tarball check → GitHub Release → npm publish
#   through OIDC trusted publishing, which needs `id-token: write` and no
#   stored token.
# The bare-name tarball cannot go to npm (anti-squat rejection); it rides the
# GitHub Release for profile installs.
# The full checkout lets the tag check see master. The two check-release
# invocations must stay identical to the local calls recorded in
# docs/release-runbook.md; tests/release-workflow.spec.ts pins them.
# Registry is pinned twice (setup-node registry-url + --registry) so a
# contributor's local npmmirror default can never redirect the publish.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (both faces)
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Unit tests (e2e.real self-skips without keys)
        run: pnpm test
      - name: i18n parity
        run: pnpm run check:i18n
      - name: Build
        run: pnpm run build
      # Node 22 bundles npm 10; trusted publishing needs npm >= 11.5.1 and its
      # dist-tag support needs npm >= 11.21, so track the 11.x line.
      - name: Install npm 11
        run: npm install -g npm@11
      - name: Tag consistency (tag, package.json, CHANGELOG, USER_AGENT; tag on master)
        run: node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
      - name: Pack dual names
        run: node scripts/pack.mjs
      - name: Tarball check (required files, no internal documents, no token values)
        run: node scripts/check-release.mjs --tarballs dist-artifacts
      - name: Create GitHub Release with both tarballs
        # upload fallback keeps reruns working when the release already exists
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist-artifacts/*.tgz || gh release upload "$GITHUB_REF_NAME" dist-artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish scoped package to npmjs.org through trusted publishing
        id: publish
        # the ./ prefix forces a local-path read; a bare slash-containing arg
        # parses as an npm spec (GitHub shorthand) and fails via git ls-remote
        run: npm publish ./dist-artifacts/maricgeer-dsh-websearch-*.tgz --registry https://registry.npmjs.org --access public --provenance
      - name: Show npm's trusted-publishing diagnosis when the publish fails
        # npm reports a failed token exchange only at verbose or silly level in its
        # debug log and then fails with a generic ENEEDAUTH. The log stays on the
        # runner, so a re-run (which reads the workflow from the tagged commit)
        # cannot recover it. Only lines that name npm's oidc logger are printed:
        # they carry the registry's reason and no credential value.
        if: "failure() && steps.publish.outcome == 'failure'"
        run: grep -hE ' [a-z]+ oidc ' "$(npm config get cache)"/_logs/*-debug-0.log || echo "no trusted-publishing lines in npm's debug logs"
