# CI gate: the local close-out wall, replicated on GitHub — on every pull
# request and every push to master. It ends with the release rehearsal of
# ADR-0026: pack both distribution tarballs and check their contents, so a
# packaging defect surfaces before a tag triggers the real pipeline. Nothing
# here publishes; that is release.yml's job on a vX.Y.Z tag.
# Node matrix matches engines (^22.19 || >=24); pnpm comes from the
# packageManager field; pnpm-workspace.yaml ships the release-age gate
# config so CI installs behave exactly like local ones.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (both faces)
        run: |
          pnpm run typecheck
          pnpm run typecheck:client
      - name: Lint
        run: pnpm run lint
      - name: Unit tests (e2e.real self-skips without keys)
        run: pnpm test
      - name: i18n parity
        run: pnpm run check:i18n
      - name: Build
        run: pnpm run build
      - name: "Release rehearsal: pack dual names"
        run: node scripts/pack.mjs
      - name: "Release rehearsal: tarball check"
        run: node scripts/check-release.mjs --tarballs dist-artifacts
